<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Registration</title>
</head>
<body>

<h1>Registration</h1>
<table>
	<form method="POST">
		 
			<tr> 
				<td>
	<fieldset>
	
 <legend>General Information :</legend>

 <table
<tr>	
		<td><label for="fname"><b>Full Name :</b></label>
		<input type="text" name="fullname" id="fname">	
		<br>
		<br>

		<label for="lname"><b>Last Name :</b></label>
		<input type="text" name="lastname" id="lname">	
		<br>
		<br>
		<label for="gender"><b>Gender :</b></label>
		<input type="radio" name="gender" id="male" value="male">	
		<label for="male">Male</label>
		<input type="radio" name="gender" id="female" value="female">	
		<label for="female">Female</label>
		<br>
		<br>

		<label for="fathername"><b>Father's Name :</b></label>
		<input type="text" name="fathername" id="fathername">
		<input type="file" name="fatherphoto" id="fatherphoto">
		<br>
		<br>

		<label for="mothername"><b>Mother's Name :</b></label>
		<input type="text" name="mothername" id="mothername">
		<br>
		<label for="bloodgrp"><b>Blood Group :</b></label>
		<select name="bloodgrp" id="bloodgrp">
			<option value="A+">A+</option>
			<option value="A-">A-</option>
			<option value="B+">B+</option>
			<option value="B-">B-</option>
			<option value="O+">O+</option>
			<option value="O-">O-</option>
			<option value="AB+">AB+</option>
			<option value="AB-">AB-</option>
		</select>
		<br>

		<label for="religion"><b>Religion</b></label>
		<select name="religion" id="religion">
			<option>Islam</option>
			<option>Hinduism</option>
			<option>Christianity</option>
			<option>Buddhism</option>
		</select>
		<br>
</fieldset>
</td>
<td>
	<fieldset>
		<legend>Contact Information :</legend>
		<label for="email"><b>Email :</b></label>
		<input type="email" name="email" id="email">
		<br>

		<label for="phone"><b>Phone/Mobile :</b></label>
		<input type="tel" name="phone" id="phone">
		<br>
		<label for="website"><b>Website :</b></label>
		<input type="url" name="website" id="website">
		<br>

		
		<label for="address"><b>Address :</b></label>
		<fieldset>
			<legend>Present Address:</legend>
			<select name="country" id="country">
				<option value="Bangladesh">Bangladesh</option>
				<option value="Nepal">Nepal</option>
				<option value="Bhutan">Bhutan</option>
				<option value="Iran">Iran</option>
			</select>
			<select name="city" id="city">
				<option value="Dhaka">Dhaka</option>
				<option value="Chittagong">Chittagong</option>
				<option value="Khulna">Khulna</option>
			</select>
			<br>
		<textarea name="address" placeholder="Road/Street/City" id="address"></textarea>
		<br>

		<label for="postcode"><b>Post Code :</b></label>
		<input type="number" name="postcode" placeholder="Post Code" id="postcode" maxlength="5">
		<br>
		</fieldset>

</fieldset>
</td>
<td>
<fieldset>
		<legend>Account Information :</legend>
		<label for="username"><b>Username :</b></label>
		<input type="text" name="username" id="username">
		<br>
		<label for="password"><b>Password :</b></label>
		<input type="password" name="password" id="password">
		<br>
		<label for="cpass"><b>Confirm Password :</b></label>
		<input type="password" name="cpass" id="cpass">
		<br>
		
</fieldset>

<input type="submit" name="submit" value="Register">
</td>
</tr>
	</form>

</table>
</body>
</html>
